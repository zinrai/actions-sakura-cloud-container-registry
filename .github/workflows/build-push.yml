name: Build and Push to Sakura Cloud Container Registry

on:
  workflow_call:
    inputs:
      registry-name:
        description: 'Sakura Cloud Container Registry name (e.g., your-registry.sakuracr.jp)'
        required: true
        type: string
      image-name:
        description: 'Image name (default: repository name)'
        required: false
        type: string
        default: ''
      context:
        description: 'Build context path'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'
      cache-from-type:
        description: 'Cache source type'
        required: false
        type: string
        default: 'gha'
      cache-to-type:
        description: 'Cache destination type'
        required: false
        type: string
        default: 'gha'
      cache-to-mode:
        description: 'Cache mode (min or max)'
        required: false
        type: string
        default: 'max'
      runs-on:
        description: 'Runner to use'
        required: false
        type: string
        default: '["ubuntu-latest"]'
      build-args:
        description: 'Build arguments (multiline)'
        required: false
        type: string
        default: ''
    secrets:
      registry-username:
        description: 'Sakura Cloud Container Registry username'
        required: true
      registry-password:
        description: 'Sakura Cloud Container Registry password'
        required: true

jobs:
  build-and-push:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    
    permissions:
      contents: read
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Sakura Cloud Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry-name }}
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-password }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ inputs.registry-name }}/${{ inputs.image-name || github.repository }}:${{ github.ref_name }}
          cache-from: type=${{ inputs.cache-from-type }}
          cache-to: type=${{ inputs.cache-to-type }},mode=${{ inputs.cache-to-mode }}
          build-args: ${{ inputs.build-args }}
