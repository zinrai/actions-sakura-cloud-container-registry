name: Build and Push to Sakura Cloud Container Registry

on:
  workflow_call:
    inputs:
      registry-name:
        description: 'Sakura Cloud Container Registry name (e.g., your-registry.sakuracr.jp)'
        required: true
        type: string
      image-name:
        description: 'Image name (default: repository name)'
        required: false
        type: string
        default: ''
      context:
        description: 'Build context path'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'
      platforms:
        description: 'Target platforms (e.g., linux/amd64,linux/arm64)'
        required: false
        type: string
        default: 'linux/amd64'
      cache-from-type:
        description: 'Cache source type'
        required: false
        type: string
        default: 'gha'
      cache-to-type:
        description: 'Cache destination type'
        required: false
        type: string
        default: 'gha'
      cache-to-mode:
        description: 'Cache mode (min or max)'
        required: false
        type: string
        default: 'max'
      runs-on:
        description: 'Runner to use'
        required: false
        type: string
        default: '["ubuntu-latest"]'
      build-args:
        description: 'Build arguments (multiline)'
        required: false
        type: string
        default: ''
    secrets:
      registry-username:
        description: 'Sakura Cloud Container Registry username'
        required: true
      registry-password:
        description: 'Sakura Cloud Container Registry password'
        required: true

jobs:
  build-and-push:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    
    permissions:
      contents: read
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to Sakura Cloud Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ inputs.registry-name }}
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-password }}

      - name: Build and push Docker image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ inputs.registry-name }}/${{ inputs.image-name || github.repository }}:${{ github.ref_name }}
          cache-from: type=${{ inputs.cache-from-type }}
          cache-to: type=${{ inputs.cache-to-type }},mode=${{ inputs.cache-to-mode }}
          build-args: ${{ inputs.build-args }}
