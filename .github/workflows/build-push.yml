name: Build and Push to Sakura Cloud Container Registry

on:
  workflow_call:
    inputs:
      registry-name:
        description: 'Sakura Cloud Container Registry name (e.g., your-registry.sakuracr.jp)'
        required: true
        type: string
      image-name:
        description: 'Image name (default: repository name)'
        required: false
        type: string
        default: ''
      context:
        description: 'Build context path'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'
      platforms:
        description: 'Target platforms (e.g., linux/amd64,linux/arm64)'
        required: false
        type: string
        default: 'linux/amd64'
      cache-from-type:
        description: 'Cache source type'
        required: false
        type: string
        default: 'gha'
      cache-to-type:
        description: 'Cache destination type'
        required: false
        type: string
        default: 'gha'
      cache-to-mode:
        description: 'Cache mode (min or max)'
        required: false
        type: string
        default: 'max'
      runs-on:
        description: 'Runner to use'
        required: false
        type: string
        default: '["ubuntu-latest"]'
      build-args:
        description: 'Build arguments (multiline)'
        required: false
        type: string
        default: ''
    secrets:
      registry-username:
        description: 'Sakura Cloud Container Registry username'
        required: true
      registry-password:
        description: 'Sakura Cloud Container Registry password'
        required: true

jobs:
  build-and-push:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    
    permissions:
      contents: read
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Sakura Cloud Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ inputs.registry-name }}
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-password }}

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ inputs.registry-name }}/${{ inputs.image-name || github.repository }}:${{ github.ref_name }}
          cache-from: type=${{ inputs.cache-from-type }}
          cache-to: type=${{ inputs.cache-to-type }},mode=${{ inputs.cache-to-mode }}
          build-args: ${{ inputs.build-args }}
